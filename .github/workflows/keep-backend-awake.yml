# Pings the Render backend every 10 minutes so the free instance
# doesn't fall asleep (Render free web services sleep after 15 min idle).
#
# Set the repo variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://portfolio-tracker-y2gg.onrender.com
#
# Note: GitHub may delay scheduled runs at busy times and disables scheduled
# workflows after 60 days without repo activity. For a guaranteed ping,
# use an external monitor such as UptimeRobot or cron-job.org on /health.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://portfolio-tracker-y2gg.onrender.com' }}
        run: curl -fsS --max-time 120 --retry 2 "$BACKEND_URL/health" || true
